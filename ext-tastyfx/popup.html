<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TastyFX Positions Tracker</title>
<style>
  body { font-family: -apple-system, sans-serif; width: 340px; padding: 12px; font-size: 13px; color: #1a1a1a; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; }
  .label { color: #666; }
  .status { padding: 8px; border-radius: 6px; margin: 8px 0; }
  .status.ok { background: #e6f7ee; color: #0a7a3d; }
  .status.warn { background: #fff4e5; color: #9a5b00; }
  button { width: 100%; padding: 8px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; background: #f7f7f7; cursor: pointer; }
  button:hover { background: #eee; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; }
  .settings-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .settings-row input { width: 50px; }
  #actionLog { margin-top: 8px; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 11px; max-height: 320px; overflow: auto; border: 1px solid #eee; padding: 4px; }
  #actionLog:empty { display: none; border: none; padding: 0; }
  #noPositionsMsg { margin-top: 8px; color: #9a5b00; }
  #diagLog { margin-top: 4px; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 11px; max-height: 220px; overflow: auto; border: 1px solid #eee; padding: 4px; background: #fafafa; }
  #diagLog:empty { display: none; border: none; padding: 0; }
  details summary { cursor: pointer; color: #666; margin-top: 8px; }
</style>
</head>
<body>
  <h1>TastyFX Positions Tracker</h1>

  <div id="statusBox" class="status warn">Checking connection…</div>

  <div class="row"><span class="label">Last write</span><span id="lastWrite">–</span></div>
  <div class="row" id="lastErrorRow" style="display:none;"><span class="label">Last write error</span><span id="lastError"></span></div>

  <button id="forceCaptureBtn">Write Now</button>

  <div class="settings-row">
    <label for="intervalInput">Write every</label>
    <input id="intervalInput" type="number" min="1" value="20">
    <span>minutes</span>
    <button id="saveIntervalBtn" style="width:auto;">Save</button>
  </div>

  <div id="actionLog"></div>

  <table id="positionsTable" style="display:none;">
    <thead><tr><th>Market</th><th>Size</th><th>Latest</th><th>P/L</th></tr></thead>
    <tbody id="positionsBody"></tbody>
  </table>

  <div id="noPositionsMsg" style="display:none;">No positions found by the last scan -- see Diagnostics below.</div>

  <details>
    <summary>Diagnostics (last scan <span id="lastScan">–</span>)</summary>
    <pre id="diagLog"></pre>
  </details>

  <script src="popup.js"></script>
</body>
</html>
